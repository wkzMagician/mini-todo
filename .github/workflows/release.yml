# Managed by RepoFlow: https://github.com/wkzMagician/gh-repoflow
name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build apk --release
      - run: flutter build appbundle --release
      - name: Prepare APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/mini_todo-android.apk
          cp build/app/outputs/bundle/release/app-release.aab dist/mini_todo-android.aab
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/mini_todo-android.*

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA for SideStore
        run: |
          mkdir -p dist Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r dist/mini_todo.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: dist/mini_todo.ipa

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Package macOS app
        run: |
          mkdir -p dist
          ditto -c -k --keepParent "build/macos/Build/Products/Release/mini_todo.app" dist/mini_todo-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/mini_todo-macos.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install Inno Setup
        run: choco install innosetup --no-progress
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Build Windows Installer (.exe)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\mini_todo_setup.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: sudo apt-get update && sudo apt-get install -y dpkg-dev libgtk-3-dev libsecret-1-dev libayatana-appindicator3-dev
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Install nfpm
        run: |
          curl -sL -o /tmp/nfpm.deb https://github.com/goreleaser/nfpm/releases/download/v2.47.0/nfpm_2.47.0_amd64.deb
          sudo dpkg -i /tmp/nfpm.deb
      - name: Package Linux bundle (.tar.gz, .deb, .rpm)
        run: |
          set -euo pipefail
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          mkdir -p dist packaging
          # generic bundle
          tar -czf dist/mini_todo-linux-x64.tar.gz -C build/linux/x64/release bundle
          # desktop entry
          cat > packaging/mini_todo.desktop <<'EOF'
          [Desktop Entry]
          Name=Mini Todo
          Comment=A simple todo manager
          Exec=/opt/mini_todo/mini_todo
          Icon=mini_todo
          Terminal=false
          Type=Application
          Categories=Utility;
          EOF
          # nfpm config (builds both .deb and .rpm from one spec)
          cat > packaging/nfpm.yaml <<EOF
          name: mini_todo
          arch: amd64
          platform: linux
          version: ${VERSION}
          section: utils
          priority: optional
          maintainer: Kunzhen Wu <wkzmagician@gmail.com>
          description: Mini Todo desktop application
          homepage: https://github.com/wkzMagician/mini-todo

          contents:
            - src: ./build/linux/x64/release/bundle/**
              dst: /opt/mini_todo
            - src: ./packaging/mini_todo.desktop
              dst: /usr/share/applications/mini_todo.desktop
            - src: ./assets/tray_icon.png
              dst: /usr/share/icons/hicolor/256x256/apps/mini_todo.png

          overrides:
            deb:
              depends:
                - libgtk-3-0
                - libsecret-1-0
                - libayatana-appindicator3-1
            rpm:
              depends:
                - gtk3
                - libsecret
                - libappindicator-gtk3
          EOF
          nfpm package -f packaging/nfpm.yaml -p deb -t dist/mini_todo-${VERSION}-amd64.deb
          nfpm package -f packaging/nfpm.yaml -p rpm -t dist/mini_todo-${VERSION}-x86_64.rpm
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/mini_todo-*

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: sudo apt-get update && sudo apt-get install -y zip
      - run: flutter pub get
      - run: flutter build web --release
      - name: Package web build
        run: |
          mkdir -p dist
          cd build/web
          zip -r ../../dist/mini_todo-web.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: dist/mini_todo-web.zip

  release:
    needs: [android, ios, macos, windows, linux, web]
    if: ${{ startsWith(github.ref, 'refs/tags/v') && !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: downloaded_artifacts
      - name: Collect release files
        run: |
          mkdir -p release_files
          find downloaded_artifacts -type f ! -name '*.aab' -exec cp {} release_files/ \;
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          overwrite_files: true
          files: release_files/*

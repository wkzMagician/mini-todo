schema_version: 3

app:
  name: "mini_todo"
  package_name: "mini-todo"
  organization: "com.example"
  description: "A compact multilingual desktop todo application."

platforms:
  android: true
  ios: false
  windows: true
  macos: true
  linux: true
  web: false

capabilities:
  settings:
    instances:
      default:
        implementation: "shared_preferences"
      sync_secrets:
        implementation: "secure_storage"
  storage:
    instances:
      json:
        implementation: "json_file"
        options:
          path: "mini_todo/data.json"
  logging:
    instances:
      default:
        implementation: "logger"
  autostart:
    instances:
      default:
        implementation: "launch_at_startup"
        platforms:
          - "windows"
          - "macos"
          - "linux"
  sync:
    instances:
      default:
        implementation: "etag"
        stores:
          - "storage.json"
        backend:
          implementation: "webdav"
          options:
            root_path: "MiniTodo"
            connect_timeout: "10s"
            request_timeout: "30s"
            max_parallel_requests: 4
            create_missing_collections: true
        policy:
          mode: "automatic"
          triggers:
            startup: true
            resume: true
            connectivity_restored: true
            local_write:
              enabled: true
              debounce: "2s"
              max_delay: "10s"
          discovery:
            remote_changes: "auto"
            poll_interval: "5m"
            safety_reconcile_interval: "15m"
          execution:
            timeout: "2m"
            busy_behavior: "coalesce_then_rerun"
            max_parallel_transfers: 4
            max_object_size: "20mb"
          retry:
            strategy: "exponential"
            initial_delay: "5s"
            fixed_delay: "30s"
            sequence:
              - "5s"
              - "30s"
              - "2m"
              - "10m"
            multiplier: 3
            max_delay: "10m"
            jitter: "20%"
            max_attempts: 0
          conflicts:
            strategy: "preserve"
            delete_vs_update: "conflict"
          state:
            base_payload: "always"
            tombstone_retention: "30d"
          profiles:
            sync_on_activate: true
            existing_data: "attach_to_default"
          platforms:
            android:
              discovery:
                poll_interval: "5m"
              background:
                enabled: true
                enqueue_on_pending: true
                periodic_interval: "15m"
                flex_interval: "5m"
                network: "connected"
                requires_battery_not_low: true
                requires_charging: false
                timeout: "2m"
            windows:
              discovery:
                poll_interval: "5m"
            macos:
              discovery:
                poll_interval: "5m"
            linux:
              discovery:
                poll_interval: "5m"
  localization:
    instances:
      default:
        implementation: "gen_l10n"
  resident:
    instances:
      default:
        implementation: "tray"
        platforms:
          - "windows"
          - "macos"
          - "linux"
        options:
          icon_path: "windows/runner/resources/app_icon.ico"
          icon_path_linux: "assets/tray_icon.png"
          tooltip: "Mini Todo"

sources:
  capabilities: github

release:
  github: true

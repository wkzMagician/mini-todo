schema_version: 2

app:
  name: "mini_todo"
  organization: "com.example"
  description: "A compact multilingual desktop todo application."

platforms:
  android: true
  ios: false
  windows: true
  macos: true
  linux: false
  web: false

capabilities:
  settings:
    instances:
      default:
        implementation: "shared_preferences"
  storage:
    instances:
      json:
        implementation: "json_file"
        options:
          path: "mini_todo/data.json"
  logging:
    instances:
      default:
        implementation: "logger"
  autostart:
    instances:
      default:
        implementation: "launch_at_startup"
  sync:
    instances:
      default:
        implementation: "etag_object"
        factory: "app_sync"
        depends_on:
          - "settings.default"
        stores:
          - "storage.json"
        backend:
          implementation: "webdav"
          options:
            base_url: "https://example.invalid"
            root_path: "MiniTodo"
  localization:
    instances:
      default:
        implementation: "gen_l10n"
  resident:
    instances:
      default:
        implementation: "tray"
        options:
          icon_path: "windows/runner/resources/app_icon.ico"
          tooltip: "Mini Todo"

sources:
  capabilities: github

release:
  github: true
